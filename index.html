/* ---- le quartier général isométrique ---- */
const QG={TW:64,TH:32,OX:296,OY:78};
const QG_Z=[["Direction",0,3,0,3,"#C9BEF7",1.5,2.7],["Toi",3,6,0,3,"#FFD9A8",4.5,2.7],["Chasse",6,10,0,3,"#BFD0FF",8.4,2.7],["Ciblage et préparation",0,4,3,6,"#DCC6FB",2,5.72],["Placement",0,4,6,8,"#FFC9B8",2.4,7.7],["Appels d'offres",4,10,3,8,"#FFC4E3",6,7.82]];

 "Matching Vivier":[1.0,7.0],"Veille AO":[5.3,4.3],"AO Analyse":[7.1,4.3],"AO Mémoire":[8.9,4.3],"AO Chiffrage":[5.3,6.5],"AO Admin":[7.1,6.5],"AO Relecture":[8.9,6.5]};

function qP(x,y,z){return [QG.OX+(x-y)*QG.TW/2,QG.OY+(x+y)*QG.TH/2-(z||0)];}
function qPts(a){return a.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");}
function qBoite(x,y,w,d,hh,top,g,dr){const A=qP(x,y,hh),B=qP(x+w,y,hh),C=qP(x+w,y+d,hh),D=qP(x,y+d,hh),C0=qP(x+w,y+d),D0=qP(x,y+d),B0=qP(x+w,y);
  return `<polygon points="${qPts([D,C,C0,D0])}" fill="${g}"/><polygon points="${qPts([B,C,C0,B0])}" fill="${dr}"/><polygon points="${qPts([A,B,C,D])}" fill="${top}"/>`;}
function qgConstruire(C){
  C.replaceChildren();h("div",{class:"titre"},C,"Le quartier général · en direct");const cadre=h("div",{class:"cadre"},C);let s="";
  // nuages, île (herbe et terre), sol
  s+=`<g fill="#fff" opacity=".75"><ellipse cx="80" cy="60" rx="34" ry="9"/><ellipse cx="104" cy="54" rx="20" ry="8"/><ellipse cx="590" cy="330" rx="30" ry="8"/><ellipse cx="566" cy="336" rx="18" ry="6"/><ellipse cx="60" cy="372" rx="26" ry="7"/></g>`;
  s+=qBoite(-.35,-.35,10.7,8.7,-34,"#7BC47F","#8B5E3C","#6F4A2F").replace(/<polygon points="[^"]*" fill="#7BC47F"\/>/,"");
  s+=`<polygon points="${qPts([qP(-.35,-.35),qP(10.35,-.35),qP(10.35,8.35),qP(-.35,8.35)])}" fill="#7BC47F"/>`;
  s+=`<polygon points="${qPts([qP(-.35,8.35),qP(10.35,8.35),qP(10.35,8.35,-8),qP(-.35,8.35,-8)])}" fill="#5FA864"/><polygon points="${qPts([qP(10.35,-.35),qP(10.35,8.35),qP(10.35,8.35,-8),qP(10.35,-.35,-8)])}" fill="#4F9455"/>`;
  s+=`<polygon points="${qPts([qP(0,0),qP(10,0),qP(10,8),qP(0,8)])}" fill="#E9D8B8"/>`;
  for(const [n,x0,x1,y0,y1,c] of QG_Z)s+=`<polygon points="${qPts([qP(x0+.08,y0+.08),qP(x1-.08,y0+.08),qP(x1-.08,y1-.08),qP(x0+.08,y1-.08)])}" fill="${c}" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>`;
  // murs de brique et verrières (les deux murs du fond)
  s+=`<polygon points="${qPts([qP(0,0),qP(10,0),qP(10,0,48),qP(0,0,48)])}" fill="#B5553C"/><polygon points="${qPts([qP(0,0),qP(0,8),qP(0,8,48),qP(0,0,48)])}" fill="#9A4631"/>`;
  for(let i=0;i<10;i++)s+=`<polygon points="${qPts([qP(i+.18,0,12),qP(i+.82,0,12),qP(i+.82,0,40),qP(i+.18,0,40)])}" fill="#FFE9A8" stroke="#1b1b1b" stroke-width="1.8"/><path d="M${qP(i+.5,0,12).join(" ")}L${qP(i+.5,0,40).join(" ")}" stroke="#1b1b1b" stroke-width="1"/>`;
  for(let j=0;j<8;j++)s+=`<polygon points="${qPts([qP(0,j+.18,12),qP(0,j+.82,12),qP(0,j+.82,40),qP(0,j+.18,40)])}" fill="#FFD98A" stroke="#1b1b1b" stroke-width="1.8"/><path d="M${qP(0,j+.5,12).join(" ")}L${qP(0,j+.5,40).join(" ")}" stroke="#1b1b1b" stroke-width="1"/>`;
  // plantes et postes, du fond vers l'avant
  const objs=[];for(const [x,y] of [[2.6,.5],[5.6,.5],[9.65,2.6],[3.6,7.6],[9.6,7.6],[4.45,3.45],[.4,2.6],[6.35,2.6],[9.6,5.4]]){const [X,Y]=qP(x,y,9);
    objs.push([x+y,qBoite(x-.13,y-.13,.26,.26,8,"#C96A4A","#8E3F2C","#A34A33")+`<g fill="#3F9A55"><circle cx="${X}" cy="${Y-6}" r="7"/><circle cx="${X-6}" cy="${Y-1}" r="5.5" fill="#2F7F45"/><circle cx="${X+6}" cy="${Y-2}" r="5.5" fill="#56B36C"/></g>`]);}
  Object.entries(QG_P).forEach(([nom,[cx,cy]],i)=>{const coul=nom==="Jérôme"?"#D41C86":(COUL[nom]==="#20185D"?"#5B4BC4":(COUL[nom]||"#5A5480")),[X,Y]=qP(cx,cy+.5),m1=qP(cx-.22,cy-.04,9),m2=qP(cx+.22,cy-.04,9);
    const peau=["#f1c9a5","#e0ac87","#c68b62","#8d5a3b"][i%4],ini=QG_INI[nom]||INI[nom]||"?",lw=ini.length>2?30:24;
    objs.push([cx+cy,`<g class="ia" data-nom="${nom}"><ellipse class="qh" cx="${X}" cy="${Y}" rx="14" ry="7"/>${qBoite(cx-.4,cy-.24,.8,.48,9,"#D2A679","#9A6B43","#B17F54")}
     <polygon points="${qPts([m1,m2,[m2[0],m2[1]-17],[m1[0],m1[1]-17]])}" fill="#120e2e"/><polygon class="qe" points="${qPts([[m1[0]+1.6,m1[1]-1.2],[m2[0]-1.6,m2[1]-2.8],[m2[0]-1.6,m2[1]-15.4],[m1[0]+1.6,m1[1]-13.8]])}"/>
     <g class="qperso"><ellipse cx="${X}" cy="${Y-9}" rx="7.5" ry="9.5" fill="${coul}"/><circle cx="${X}" cy="${Y-23}" r="6.2" fill="${peau}"/><path d="M${X-6.2} ${Y-24}a6.2 6.2 0 0 1 12.4 0q-6.2-4-12.4 0Z" fill="#2b2147"/></g>
     <rect class="qpill" x="${X-lw/2}" y="${Y-47}" width="${lw}" height="12" rx="6" fill="#fff"/><text x="${X}" y="${Y-38.2}" text-anchor="middle" font-size="8" font-weight="800" fill="#20185D">${ini}</text>
     <rect x="${X-12}" y="${Y-33.5}" width="24" height="3.2" rx="1.6" fill="rgba(32,24,93,.25)"/><rect class="qv" x="${X-12}" y="${Y-33.5}" width="24" height="3.2" rx="1.6"/><title>${nom}</title></g>`]);});
  objs.sort((a,b)=>a[0]-b[0]);s+=objs.map(o=>o[1]).join("");
  // noms des salles, par-dessus tout, à l'avant de chaque salle
  for(const z of QG_Z){const n=z[0],[X,Y]=qP(z[6],z[7]),w=n.length*5.7+16;s+=`<g transform="translate(${(X-w/2).toFixed(1)},${(Y-7).toFixed(1)})"><rect width="${w}" height="14" rx="7" fill="#20185D" opacity=".88"/><text x="${w/2}" y="10.2" text-anchor="middle" font-size="8.6" font-weight="700" fill="#fff" letter-spacing=".5">${n.toUpperCase().replace("'","’")}</text></g>`;}
  s+=`<g class="qg-pli"><path d="M-9 0 9 -6 3 8 0 2Z" fill="#EE34A0" stroke="#fff" stroke-width="1"/></g>`;
  cadre.innerHTML=`<svg viewBox="0 0 660 424" role="img" aria-label="Quartier général : six salles, un bureau par agent">${s}</svg>`;
  cadre.querySelectorAll(".ia").forEach(g=>{g.addEventListener("click",()=>buChoisir(g.dataset.nom));});}
function qgMaj(d,C){const A=Object.fromEntries(d.agents.map(a=>[a.nom,a]));
  C.querySelectorAll(".ia").forEach(g=>{const nom=g.dataset.nom;let e="repos",v="moi",vie=100;
    if(nom==="Jérôme"){const n=(d.attentes||[]).reduce((s,x)=>s+x.nb,0);e=n?"attente":"repos";vie=Math.round(100*((d.agence||{}).signes||0)/6);}
    else{const a=A[nom],s=buVie(d,nom);if(!a){g.style.display="none";return;}e=a.etat;v=s?s.etat:"vivant";vie=s?s.vie:100;}
    g.setAttribute("class",`ia e-${e} v-${v}${BU.sel===nom?" sel":""}`);g.querySelector(".qv").setAttribute("width",(24*vie/100).toFixed(1));});}
function qgVol(C,m){const lieu=n=>n==="Pilotage"?"Orchestrateur":n,a=QG_P[lieu(m.de)],b=QG_P[lieu(m.a)],p=C.querySelector(".qg-pli");if(!a||!b||!p)return;
  const [x1,y1]=qP(a[0],a[1]+.5,30),[x2,y2]=qP(b[0],b[1]+.5,30);p.style.transition="none";p.style.opacity="1";p.style.transform=`translate(${x1}px,${y1}px)`;p.getBoundingClientRect();p.style.transition="";
  requestAnimationFrame(()=>{p.style.transform=`translate(${x2}px,${y2}px)`;});setTimeout(()=>{p.style.opacity="0";},1700);}
