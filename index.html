    h("div",{style:"font-size:12px;color:var(--muted)"},c,`Résultat ${s.avance} % · temps écoulé ${s.temps} %`);
    const pl=(d.plans||{})[s.nom];if(pl){const x=h("div",{style:"font-size:13px;border-top:1px solid var(--line2);padding-top:8px"},c);h("b",{style:"color:var(--accent)"},x,`Plan ${pl.code} · ${pl.nom}`);h("div",{class:"muted"},x,`Pourquoi : ${pl.motif||"—"}`);}
    h("div",{style:"font-size:13px;color:var(--bad)"},c,"Meurt si : "+s.meurt_si);}
}

/* ---------- pilotage, pipeline, AO, journal ---------- */
function pilotage(){
  const d=data,o=d.objectif,S=document.getElementById("t-pilotage");S.replaceChildren();h("h1",{style:"margin:0;font-size:26px"},S,"Pilotage");
  const k=h("div",{class:"kpis"},S);const k0=h("div",{class:"kpi dark"},k);h("small",{style:"color:var(--navy-muted)"},k0,"Contrats signés, objectif 6");h("b",{},k0,`${o.signes} / ${o.cible}`);
  for(const b of o.butoirs){const x=h("div",{class:"kpi"},k);h("small",{},x,`${b.objectif} avant le ${new Date(b.date).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}`);h("b",{},x,b.etat==="OK"?"atteint":"J-"+b.jours);}
  const f=h("section",{class:"card"},S);h("h2",{style:"margin:0 0 10px;font-size:19px"},f,"Du besoin à la signature");const mx=Math.max(1,...d.entonnoir.map(e=>e.n));let gi=-1;
  for(let i=1;i<d.entonnoir.length;i++)if(d.entonnoir[i-1].n>0&&d.entonnoir[i].n===0){gi=i;break;}
  d.entonnoir.forEach((e,i)=>{const l=h("div",{class:"fun"+(i===gi?" goulot":"")},f);h("span",{style:"font-size:14px"},l,e.etape);const b=h("div",{class:"bar"},l);h("i",{style:`width:${e.n?Math.max(2,e.n/mx*100):0}%`},b);h("b",{style:"text-align:right;font-variant-numeric:tabular-nums"},l,String(e.n));});
  if(gi>0&&d.bloquants[0])h("div",{class:"note",style:"margin-top:10px"},f,`Goulot : ${d.bloquants[0].titre} : ${d.bloquants[0].detail}`);
  const cc=h("section",{class:"card"},S);h("h2",{style:"margin:0;font-size:19px"},cc,"Comptes chauds");for(const s of d.comptes_chauds){const l=h("div",{class:"line"},cc);h("span",{class:"chip",style:`color:#fff;background:${s.priorite==1?"#B45309":"#5B6B82"}`},l,"P"+s.priorite);
    const g=h("div",{class:"grow"},l);h("div",{style:"font-weight:700;font-size:14px"},g,s.nom+(s.ville?" · "+s.ville:""));texte("div",{style:"font-size:13px;color:var(--ink2)"},g,s.actualite);}
  const sr=h("section",{class:"card"},S);h("h2",{style:"margin:0 0 8px;font-size:19px"},sr,"Les sources qui rapportent");const t=h("table",{},h("div",{class:"tw"},sr));const hr=h("tr",{},t);["Source","Besoins","A","Validés"].forEach(z=>h("th",{},hr,z));
  for(const s of d.par_source.slice(0,10)){const r=h("tr",{},t);h("td",{},r,s.source);[s.besoins,s.a,s.valides].forEach(z=>h("td",{class:"num"},r,String(z??0)));}
}
function pipeline(){
  const d=data,S=document.getElementById("t-pipeline");S.replaceChildren();const c=h("div",{class:"card"},S);h("h2",{style:"margin:0 0 8px;font-size:20px"},c,"Besoins ouverts");
  const t=h("table",{},h("div",{class:"tw"},c));const hr=h("tr",{},t);["Niv.","Client","Besoin","Statut","Contact"].forEach(z=>h("th",{},hr,z));
  for(const b of d.besoins.filter(x=>!["clos","perdu"].includes(x.statut))){const r=h("tr",{class:"clic",tabindex:"0"},t);r.onclick=()=>ouvrirFiche(b.id);r.onkeydown=e=>{if(e.key==="Enter")ouvrirFiche(b.id);};
    [b.niveau,b.soc,b.titre].forEach(z=>h("td",{},r,z??""));const st=h("td",{},r);h("span",{class:"chip",style:"background:var(--rest-soft);color:var(--ink2)"},st,b.statut);h("td",{},r,b.contact||"—");}
}
function ao(){const d=data,S=document.getElementById("t-ao");S.replaceChildren();const c=h("div",{class:"card"},S);h("h2",{style:"margin:0 0 8px;font-size:20px"},c,"Appels d'offres");
  for(const a of d.ao.filter(x=>!["no_go","perdu","sans_suite"].includes(x.statut)).slice(0,40)){const l=h("div",{class:"line"},c);h("b",{style:`min-width:44px;${a.j!=null&&a.j<=7?"color:var(--bad)":""}`},l,a.j==null?"?":(a.j<0?"échu":"J-"+a.j));
    const g=h("div",{class:"grow"},l);h("div",{style:"font-weight:600;font-size:14px"},g,a.objet);h("div",{class:"muted",style:"font-size:13px"},g,`${a.acheteur||""} · ${a.statut}`);lien(a.source_url,"avis",g);if(a.statut==="detecte")actions(l,"ao",a.id,[["go","GO","ok sm"],["no_go","NO GO","sm",true]]);}}
function journal(){const u=document.getElementById("feed");u.replaceChildren();for(const j of data.journal.slice(0,60)){const li=h("li",{},u);h("small",{},li,j.date.slice(0,16).replace("T"," ")+" · ");h("b",{},li,j.agent);li.append(" — "+j.action);}}

/* ---------- démarrage ---------- */
function tout(){if(!data)return;const tot=data.attentes.reduce((s,a)=>s+a.nb,0);document.getElementById("nb-att").textContent=tot;
  document.getElementById("stamp").textContent="Données du "+new Date(data.genere_le).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  aToi();survieTab();bureau();pilotage();pipeline();ao();journal();if(ficheId)fiche();}
function onglet(t){document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.t===t));document.querySelectorAll("section.tab").forEach(s=>s.classList.toggle("on",s.id==="t-"+t));window.scrollTo(0,0);}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)onglet(b.dataset.t);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("fiche").hidden=true;document.getElementById("noteBox").hidden=true;ficheId=null;}});
const MDP_CLE="yevo-bo-mdp";
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function dechiffrer(mdp){const e=await (await fetch("data.enc.json",{cache:"no-store"})).json();
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(mdp),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e.salt),iterations:e.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},key,b64(e.ct));return JSON.parse(new TextDecoder().decode(pt));}
async function ouvrir(mdp,retenir){try{data=await dechiffrer(mdp);}catch(_){return false;}
  if(retenir){try{localStorage.setItem(MDP_CLE,mdp);}catch(_){}}document.getElementById("login").hidden=true;tout();return true;}
(async()=>{let m=null;try{m=localStorage.getItem(MDP_CLE);}catch(_){}if(m&&await ouvrir(m,false))return;
  const L=document.getElementById("login");L.hidden=false;document.getElementById("t-atoi").replaceChildren();
  document.getElementById("login-form").addEventListener("submit",async e=>{e.preventDefault();const v=document.getElementById("mdp").value;
    const ok=await ouvrir(v,document.getElementById("retenir").checked);if(!ok){const x=document.getElementById("login-err");x.hidden=false;}});})();
(async()=>{try{const c=window.claude;db=c&&c.use?await c.use("db"):null;}catch(_){db=null;}
  if(db){db.collection("decisions").onSnapshot(s=>{decisions=s.docs.map(x=>Object.assign({_id:x.id},x.data()));tout();},()=>{});}else if(data)tout();})();
</script>
